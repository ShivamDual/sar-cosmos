<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A solar system">
<title>Solar system</title>
<defs><radialGradient id="sun" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#fff6d6"/><stop offset=".5" stop-color="#ffb94d"/><stop offset="1" stop-color="#e0664a" stop-opacity=".2"/></radialGradient></defs>
<circle cx="200" cy="200" r="40" fill="none" stroke="#9db0cb" stroke-opacity=".18"/><circle cx="200" cy="200" r="62" fill="none" stroke="#9db0cb" stroke-opacity=".18"/><circle cx="200" cy="200" r="86" fill="none" stroke="#9db0cb" stroke-opacity=".18"/><circle cx="200" cy="200" r="112" fill="none" stroke="#9db0cb" stroke-opacity=".18"/><circle cx="200" cy="200" r="150" fill="none" stroke="#9db0cb" stroke-opacity=".18"/>
<circle cx="200" cy="200" r="24" fill="url(#sun)"><animate attributeName="r" values="23;25;23" dur="5s" repeatCount="indefinite"/></circle>
<g><animateMotion dur="3.7s" repeatCount="indefinite" path="M 240 200 a 40 40 0 1 0 -80 0 a 40 40 0 1 0 80 0"/><circle r="3.0" fill="#c9a27e"/></g><g><animateMotion dur="6.1s" repeatCount="indefinite" path="M 262 200 a 62 62 0 1 0 -124 0 a 62 62 0 1 0 124 0"/><circle r="4.0" fill="#e6c48a"/></g><g><animateMotion dur="9.3s" repeatCount="indefinite" path="M 286 200 a 86 86 0 1 0 -172 0 a 86 86 0 1 0 172 0"/><circle r="4.5" fill="#4fe3d0"/></g><g><animateMotion dur="13.6s" repeatCount="indefinite" path="M 312 200 a 112 112 0 1 0 -224 0 a 112 112 0 1 0 224 0"/><circle r="3.5" fill="#e0664a"/></g><g><animateMotion dur="20.4s" repeatCount="indefinite" path="M 350 200 a 150 150 0 1 0 -300 0 a 150 150 0 1 0 300 0"/><circle r="8.0" fill="#f2d4a4"/></g>
</svg>